
services:
  nginx:
    image: nginx:latest
    volumes:
      - ./backend:/var/www
      - ./frontend:/app
      - ./nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    container_name: shop_nginx


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - ./nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
    container_name: shop_frontend
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www
    container_name: shop_backend
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    volumes:
      - ./tmp/db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: shop
      MYSQL_ROOT_PASSWORD: root
    container_name: shop_db
    ports:
      - "3307:3306"
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci

  queue_worker:
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www
    command: sh -c "sleep 10 && php artisan queue:work"
    container_name: shop_queue_worker
    depends_on:
      - backend
      - db